function phonemeFor(letter){const en={A:'aah',B:'buh',C:'kuh',D:'duh',E:'eh',F:'fff',G:'guh',H:'huh',I:'ih',J:'juh',K:'kuh',L:'lll',M:'mmm',N:'nnn',O:'ooh',P:'puh',Q:'kwuh',R:'rrr',S:'sss',T:'tuh',U:'uh',V:'vvv',W:'wuh',X:'ks',Y:'yuh',Z:'zzz'};const af={A:'aa',B:'buh',C:'kuh',D:'duh',E:'eh',F:'fff',G:'gh',H:'huh',I:'ie',J:'juh',K:'kuh',L:'lll',M:'mmm',N:'nnn',O:'oo',P:'puh',Q:'kwuh',R:'rrr',S:'sss',T:'tuh',U:'uh',V:'fff',W:'wuh',X:'ks',Y:'yuh',Z:'zzz'};return (S.lang==='af'?af:en)[String(letter).toUpperCase()]||String(letter)}
function sayPhoneme(letter){speak(phonemeFor(letter))}
function sayCurrent(kind){const d=getQuestion();if(!d)return;if(current==='phonics'){const w=d[0];if(kind==='word')speak(w);else sayPhoneme(d[2])}else if(current==='words'){speak(d[0])}else if(current==='reading'){speak(d[0])}else if(current==='math'){speak(d[2])}else if(current==='puzzles'){speak(d[0])}}
function bindTap(el,fn){let last=0;const run=e=>{const now=Date.now();if(now-last<450)return;last=now;if(e.type==='touchend')e.preventDefault();fn(e)};el.addEventListener('touchend',run,{passive:false});el.addEventListener('click',run)}
function getData(){return Q[current][S.lang]}
function getQuestion(){return getData()[index]}
function questionId(){return current+'-'+index}
function rewardOnce(){const id=questionId();if(S.completed[current][id])return false;S.completed[current][id]=true;S.stars++;S.done++;S.streak++;S.best=Math.max(S.best,S.streak);if(S.done===5&&!S.badges.includes('first'))S.badges.push('first');save();return true}
function fail(){S.streak=0;save()}
function updateHome(){document.getElementById('stars').textContent=S.stars;document.getElementById('statStars').textContent=S.stars;document.getElementById('statBadges').textContent=S.badges.length;document.getElementById('statDone').textContent=S.done;document.getElementById('statStreak').textContent=S.best;document.getElementById('heroArt').textContent=S.avatar+' 🦄';document.getElementById('brand').textContent=t('brand');document.getElementById('eyebrow').textContent=t('eyebrow');document.getElementById('heroTitle').textContent=t('heroTitle');document.getElementById('heroLead').textContent=t('heroLead');document.getElementById('startBtn').textContent=t('start');document.getElementById('chooseAvatar').textContent=t('choose');document.getElementById('worldTitle').textContent=t('worlds');document.getElementById('worldDesc').textContent=t('worldDesc');document.getElementById('s1').textContent=t('stars');document.getElementById('s2').textContent=t('badges');document.getElementById('s3').textContent=t('done');document.getElementById('s4').textContent=t('streak');document.getElementById('stickerTitle').textContent=t('creative');document.getElementById('stickerDesc').textContent=t('creativeDesc');document.getElementById('langBtn').textContent=(S.lang==='en'?'🇬🇧 ':'🇿🇦 ')+t('langName');document.getElementById('soundBtn').textContent='🔊 '+(S.sound?t('voiceOn'):t('voiceOff'));renderWorlds();renderAvatars()}
function renderWorlds(){const box=document.getElementById('worlds');box.innerHTML='';W.forEach((w,i)=>{const unlocked=S.unlocked[w.id];const data=getWorldLength(w.id);const mastered=countMastered(w.id,data);const b=document.createElement('button');b.className='world'+(unlocked?'':' locked');b.innerHTML=`<div class="icon">${w.icon}</div><h3>${esc(w.title[S.lang])}</h3><p>${esc(w.desc[S.lang])}</p><div class="bar"><i style="width:${Math.min(100,mastered/data.length*100)}%"></i></div>`;bindTap(b,()=>openWorld(w.id));box.appendChild(b)})}
function getWorldLength(id){return Q[id][S.lang]}
function countMastered(id,data){let n=0;data.forEach((_,i)=>{if(S.completed[id]&&S.completed[id][id+'-'+i])n++});return n}
function renderAvatars(){const a=document.getElementById('avatars');a.innerHTML='';['👧','🦄','🦊','🦁','🚀'].forEach(x=>{const b=document.createElement('button');b.className='avatar'+(x===S.avatar?' selected':'');b.textContent=x;bindTap(b,()=>{S.avatar=x;save()});a.appendChild(b)})}
function openWorld(id){if(!S.unlocked[id]){showModal('🔒',t('locked'),t('lockedDesc'));return}current=id;index=0;answered=false;document.getElementById('home').classList.remove('active');document.getElementById('game').classList.add('active');renderGame()}
function renderGame(){const w=W.find(x=>x.id===current);document.getElementById('gameTitle').textContent=w.title[S.lang];if(index>=getData().length){finishWorld();return}answered=false;const d=getQuestion();let html=`<div class="progressline">${t('progress')} ${index+1} / ${getData().length}</div>`;
if(current==='phonics'){const [word,icon,ans,opts,sound,desc]=d;const masked='_ '+word.slice(1).split('').join(' ');html+=`<div class="visual">${icon}</div><div class="word">${esc(masked)}</div><div><button class="speak" data-say="word" aria-label="${t('soundWord')}">🔊</button> <button class="speak" data-say="sound" aria-label="${t('soundSound')}">🗣️</button></div><div class="prompt">${esc(S.lang==='en'?`Which letter starts ${word}?`:`Watter letter begin ${word}?`)}</div>${choices(shuffle(opts),ans)}`}
else if(current==='words'){const [word,icon]=d;const chars=word.split('');const pos=index%chars.length;const ans=chars[pos];chars[pos]='_';let opts=shuffle([...new Set([ans,...word.split('').filter(x=>x!==ans),...(S.lang==='en'?['A','E','I','O','U']:['A','E','I','O','U'])])]).slice(0,4);html+=`<div class="visual">${icon}</div><div class="word">${esc(chars.join(' '))}</div><button class="speak" data-say="word">🔊</button><div class="prompt">${esc(S.lang==='en'?'Which letter completes the word?':'Watter letter voltooi die woord?')}</div>${choices(opts,ans)}`}
else if(current==='math'){const [type,vis,q,ans,opts]=d;html+=(vis?`<div class="visual">${vis.join('')}</div>`:'')+`<div class="prompt">${esc(q)}</div><button class="speak" data-say="question">🔊</button>${choices(shuffle(opts),ans)}`}
else if(current==='puzzles'){const [q,ans,opts]=d;html+=`<div class="prompt">${esc(q)}</div><button class="speak" data-say="question">🔊</button>${choices(shuffle(opts),ans)}`}
else {const [q,ans,opts,icon]=d;html+=`<div class="visual">${icon}</div><div class="prompt">${esc(q)}</div><button class="speak" data-say="question">🔊</button>${choices(shuffle(opts),ans)}`}
document.getElementById('gameContent').innerHTML=html;bindGame();}
function choices(opts,ans){currentAnswer=ans;return `<div class="choices">${opts.map(x=>`<button class="choice" data-answer="${esc(x)}">${esc(x)}</button>`).join('')}</div><div class="feedback" id="feedback"></div><button class="next" id="next">${t('next')}</button>`}
function bindGame(){document.querySelectorAll('.choice').forEach(b=>bindTap(b,e=>answer(b,e)));document.querySelectorAll('.speak').forEach(b=>bindTap(b,()=>sayCurrent(b.dataset.say)));const n=document.getElementById('next');bindTap(n,next)}
function answer(btn,ev){if(answered)return;const d=getQuestion();const ans=currentAnswer;const ok=btn.dataset.answer===ans;document.querySelectorAll('.choice').forEach(x=>x.disabled=true);btn.classList.add(ok?'correct':'wrong');const fb=document.getElementById('feedback');if(current==='phonics')sayPhoneme(btn.dataset.answer);if(ok){answered=true;rewardOnce();fb.textContent=t('good');if(current==='phonics'){setTimeout(()=>sayCurrent('word'),380)}else{speak(t('good'))}document.getElementById('next').style.display='inline-block'}else{fb.textContent=t('wrong');fail();setTimeout(()=>{document.querySelectorAll('.choice').forEach(x=>x.disabled=false);btn.classList.remove('wrong');fb.textContent=''},900)}}
function next(){index++;renderGame()}
function finishWorld(){const badge=current;const pos=W.findIndex(x=>x.id===badge);if(pos<W.length-1)S.unlocked[W[pos+1].id]=true;S.badges=Array.from(new Set([...S.badges,badge]));save();showModal('🏆',t('finished'),t('finishedDesc'))}
function showModal(icon,title,text){document.getElementById('modalIcon').textContent=icon;document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=text;document.getElementById('modalBtn').textContent=t('again');document.getElementById('modal').classList.add('show');speak(title+' '+text)}
function closeModal(){document.getElementById('modal').classList.remove('show');if(current){document.getElementById('game').classList.remove('active');document.getElementById('home').classList.add('active');current=null;updateHome()}}
function gate(){const nums=[1,2,3,4,5,6,7,8,9];const a=nums[Math.floor(Math.random()*nums.length)],b=nums[Math.floor(Math.random()*nums.length)];const ans=a+b;document.getElementById('gateTitle').textContent=t('gate');document.getElementById('gateText').textContent=t('gateText')+' '+a+' + '+b+' = ?';const g=document.getElementById('gateGrid');g.innerHTML='';shuffle([ans,ans-1,ans+1,ans+2].filter(x=>x>0)).forEach(x=>{const b=document.createElement('button');b.textContent=x;const f=()=>{if(x===ans){S.lang=S.lang==='en'?'af':'en';save();document.getElementById('gate').classList.remove('show');renderGame();updateHome();}else{b.textContent='Try again';setTimeout(()=>b.textContent=x,650)}};bindTap(b,f);g.appendChild(b)});document.getElementById('gateCancel').textContent=t('cancel');document.getElementById('gate').classList.add('show')}
function toggleSound(){S.sound=!S.sound;save();if(!S.sound)speechSynthesis.cancel()}
function openStickers(){current='stickers';document.getElementById('home').classList.remove('active');document.getElementById('game').classList.add('active');document.getElementById('gameTitle').textContent=t('creative');document.getElementById('gameContent').innerHTML=`<div class="prompt">${t('creativeDesc')}</div><div class="sticker-tools">${['🦄','⭐','🌈','🌸','🦁','🐘','🚀','🌍','☀️','❤️','🍎','🎈'].map(x=>`<button data-sticker="${x}">${x}</button>`).join('')}</div><div class="sticker-area" id="stickerArea"></div><button class="back" id="clear" style="margin-top:12px">🗑️ ${t('clear')}</button>`;document.querySelectorAll('[data-sticker]').forEach(b=>bindTap(b,()=>sticker=b.dataset.sticker));bindTap(document.getElementById('stickerArea'),place);bindTap(document.getElementById('clear'),()=>document.getElementById('stickerArea').innerHTML='')}
function place(e){if(e.type==='touchend')e.preventDefault();const r=e.currentTarget.getBoundingClientRect();const touch=e.changedTouches?e.changedTouches[0]:e;const x=touch.clientX-r.left,y=touch.clientY-r.top;const el=document.createElement('div');el.className='sticker';el.textContent=sticker;el.style.left=x+'px';el.style.top=y+'px';e.currentTarget.appendChild(el)}
function back(){document.getElementById('game').classList.remove('active');document.getElementById('home').classList.add('active');current=null;updateHome()}
bindTap(document.getElementById('langBtn'),gate);bindTap(document.getElementById('soundBtn'),toggleSound);bindTap(document.getElementById('startBtn'),()=>openWorld('phonics'));bindTap(document.getElementById('backBtn'),back);bindTap(document.getElementById('modalBtn'),closeModal);bindTap(document.getElementById('gateCancel'),()=>document.getElementById('gate').classList.remove('show'));bindTap(document.getElementById('stickerOpen'),openStickers);updateHome();
</script></body></html>
